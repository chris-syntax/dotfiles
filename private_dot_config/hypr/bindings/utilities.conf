# Menus
bindd = SUPER, SPACE, Launch apps, exec, walker -p "Start…"

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, pkill -SIGUSR1 waybar # Toggle the waybar

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss # Dismiss one notification
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all # Dismiss notifications
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, makoctl mode -t do-not-disturb && makoctl mode | grep -q 'do-not-disturb' && notify-send "Silenced notifications" || notify-send "Enabled notifications" # Toggle Do Not Disturb

# Screenshotting
bindd = , PRINT, Screenshot of Display, exec, ~/.config/hakone/hypr-scripts/screenshot.nu
bindd = SUPER, PRINT, Screenshot of Window, exec, ~/.config/hakone/hypr-scripts/screenshot.nu --window
bindd = SUPER+CTRL, PRINT, Screenshot of Region, exec, ~/.config/hakone/hypr-scripts/screenshot.nu --region

# Logout, Restart and Sleep
bindd = CTRL+SUPER, DELETE, Logout, exit # Logout
